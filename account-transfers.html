<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account transfers - Neumorphism 2.0</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ==========================================
   RESET & BASE
   ========================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Calibri, Arial, sans-serif;
    direction: rtl;
    padding: 25px;
    min-height: 100vh;
    background: #e0e5ec;
    transition: all 0.4s ease;
}

/* ==========================================
   ROOT VARIABLES (Light - Neumorphism)
   ========================================== */
:root {
    --neu-bg: #e0e5ec;
    --neu-card: #e0e5ec;
    --neu-shadow: 9px 9px 16px #a3b1c6,
        -9px -9px 16px #ffffff;
    --neu-shadow-sm: 5px 5px 10px #a3b1c6,
        -5px -5px 10px #ffffff;
    --neu-inset: inset 5px 5px 10px #a3b1c6,
        inset -5px -5px 10px #ffffff;
    --neu-inset-deep: inset 8px 8px 16px #a3b1c6,
        inset -8px -8px 16px #ffffff;
    --neu-text: #4a5568;
    --neu-text-soft: #8a95a5;
    --neu-accent: #6d5dfc;
    --neu-accent-hover: #5a4ae0;
    --neu-success: #38b2ac;
    --neu-danger: #e53e3e;
    --neu-blue: #4299e1;
    --neu-gold: #d69e2e;
    --neu-radius: 20px;
    --neu-radius-sm: 12px;
    --table-even: #e0e5ec;
    --table-hover: #d8dfe8;
    --totals-bg: #d8dfe8;
    --collected-bg: #d4e8e0;
    --collected-color: #2c7a6b;
}

/* ==========================================
   DARK THEME (Neumorphism Dark)
   ========================================== */
[data-theme="dark"] {
    --neu-bg: #2b2f3a;
    --neu-card: #2b2f3a;
    --neu-shadow: 9px 9px 16px #1e222b,
        -9px -9px 16px #383e4d;
    --neu-shadow-sm: 5px 5px 10px #1e222b,
        -5px -5px 10px #383e4d;
    --neu-inset: inset 5px 5px 10px #1e222b,
        inset -5px -5px 10px #383e4d;
    --neu-inset-deep: inset 8px 8px 16px #1e222b,
        inset -8px -8px 16px #383e4d;
    --neu-text: #e2e8f0;
    --neu-text-soft: #8a95a5;
    --neu-accent: #8b7cfc;
    --neu-accent-hover: #a394ff;
    --neu-success: #4fd1c5;
    --neu-danger: #fc8181;
    --neu-blue: #63b3ed;
    --neu-gold: #f6ad55;
    --table-even: #2b2f3a;
    --table-hover: #353a47;
    --totals-bg: #353a47;
    --collected-bg: #1e3a35;
    --collected-color: #7de8d8;
}

body {
    background: var(--neu-bg);
    transition: all 0.4s ease;
}

/* ==========================================
   CONTAINER
   ========================================== */
.container {
    max-width: 1400px;
    margin: 0 auto;
}

/* ==========================================
   HEADER
   ========================================== */
.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 15px;
    padding: 18px 24px;
    background: var(--neu-card);
    border-radius: var(--neu-radius);
    box-shadow: var(--neu-shadow);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-logo {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--neu-accent);
    box-shadow: var(--neu-shadow-sm);
    transition: all 0.3s ease;
}

.header-logo:hover {
    transform: scale(1.08) rotate(-5deg);
}

.header-info {
    display: flex;
    flex-direction: column;
}

.header-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--neu-text);
}

.header-title span {
    color: var(--neu-accent);
}

.header-subtitle {
    color: var(--neu-text-soft);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

/* ==========================================
   BUTTONS - Neumorphism Style
   ========================================== */
.btn {
    padding: 12px 22px;
    border: none;
    border-radius: var(--neu-radius-sm);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--neu-text);
    background: var(--neu-card);
    box-shadow: var(--neu-shadow-sm);
}

.btn:hover {
    color: var(--neu-accent);
    transform: translateY(-1px);
    box-shadow: 7px 7px 14px #a3b1c6,
        -7px -7px 14px #ffffff;
}

[data-theme="dark"] .btn:hover {
    box-shadow: 7px 7px 14px #1e222b,
        -7px -7px 14px #383e4d;
}

.btn:active {
    box-shadow: var(--neu-inset);
    transform: translateY(0);
}

.btn-copy {
    color: var(--neu-success);
}
.btn-copy:hover {
    color: var(--neu-success);
}

.btn-export {
    color: var(--neu-blue);
}
.btn-export:hover {
    color: var(--neu-blue);
}

.btn-reset {
    color: var(--neu-danger);
}
.btn-reset:hover {
    color: var(--neu-danger);
}

.btn-theme {
    background: var(--neu-card);
    border: none;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--neu-text);
    box-shadow: var(--neu-shadow-sm);
}

.btn-theme:hover {
    transform: rotate(30deg) scale(1.1);
    color: var(--neu-accent);
}

.btn-theme:active {
    box-shadow: var(--neu-inset);
}

/* ==========================================
   INPUT SECTION
   ========================================== */
.input-section {
    background: var(--neu-card);
    border-radius: var(--neu-radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--neu-shadow);
}

textarea {
    width: 100%;
    height: 120px;
    padding: 16px 18px;
    border: none;
    border-radius: var(--neu-radius-sm);
    background: var(--neu-card);
    color: var(--neu-text);
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    resize: vertical;
    transition: all 0.3s ease;
    box-shadow: var(--neu-inset-deep);
}

textarea:focus {
    outline: none;
    box-shadow: var(--neu-inset-deep), 0 0 0 2px var(--neu-accent);
}

textarea::placeholder {
    color: var(--neu-text-soft);
    opacity: 0.7;
    font-weight: 500;
}

/* ==========================================
   ACTIONS BAR
   ========================================== */
.actions-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
}

.actions-bar .spacer {
    flex: 1;
}

.stats-badge {
    background: var(--neu-card);
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--neu-text);
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: var(--neu-inset);
}

.stats-badge .num {
    color: var(--neu-accent);
    font-weight: 800;
}

/* ==========================================
   TABLE - Neumorphism Style
   ========================================== */
#capture {
    background: var(--neu-card);
    border-radius: var(--neu-radius);
    padding: 8px;
    box-shadow: var(--neu-shadow);
    overflow: hidden;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--neu-card);
    border-radius: var(--neu-radius-sm);
    overflow: hidden;
}

th {
    background: var(--neu-card);
    color: var(--neu-text);
    padding: 14px 12px;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
    text-align: center;
    border-bottom: 2px solid rgba(163,177,198,0.4);
}

[data-theme="dark"] th {
    border-bottom: 2px solid rgba(30,34,43,0.6);
}

td {
    border-bottom: 1px solid rgba(163,177,198,0.25);
    padding: 11px 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--neu-text);
    transition: background 0.2s ease;
}

[data-theme="dark"] td {
    border-bottom: 1px solid rgba(30,34,43,0.4);
}

tbody tr:nth-child(even) {
    background: var(--table-even);
}

tbody tr:hover {
    background: var(--table-hover);
}

/* editable cells */
.editable {
    background: var(--neu-card);
    cursor: text;
    border-radius: 6px;
    transition: all 0.2s ease;
    box-shadow: var(--neu-inset);
}

.editable:hover {
    background: var(--table-hover);
}

.editable:focus {
    outline: 2px solid var(--neu-accent);
    background: var(--neu-card);
    outline-offset: -2px;
}

/* ==========================================
   TOTALS ROWS
   ========================================== */
.totals td {
    background: var(--totals-bg);
    font-weight: 900;
    font-size: 14px;
    color: var(--neu-text);
    border-bottom: none;
    padding: 14px 10px;
    box-shadow: var(--neu-inset);
}

.totals.collected td {
    background: var(--collected-bg);
    color: var(--collected-color);
}

/* ==========================================
   DELETE BUTTON
   ========================================== */
.del-btn {
    background: var(--neu-card);
    border: none;
    color: var(--neu-danger);
    padding: 6px 12px;
    border-radius: var(--neu-radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    transition: all 0.2s ease;
    box-shadow: var(--neu-shadow-sm);
}

.del-btn:hover {
    transform: scale(1.1);
    color: var(--neu-danger);
}

.del-btn:active {
    transform: scale(0.95);
    box-shadow: var(--neu-inset);
}

/* hide delete column in image */
.no-img {
    display: table-cell;
}

/* ==========================================
   TOAST
   ========================================== */
.toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--neu-card);
    color: var(--neu-text);
    padding: 16px 28px;
    border-radius: var(--neu-radius);
    box-shadow: var(--neu-shadow);
    font-size: 14px;
    font-weight: 700;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 90%;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

.toast .toast-icon {
    font-size: 20px;
}

/* ==========================================
   RESPONSIVE
   ========================================== */
@media(max-width:768px) {
    body {
        padding: 15px;
    }
    .header-top {
        flex-direction: column;
        align-items: flex-start;
    }
    .header-right {
        align-self: flex-end;
        margin-top: -40px;
    }
    .header-title {
        font-size: 18px;
    }
    .header-logo {
        width: 42px;
        height: 42px;
    }
    .actions-bar {
        flex-direction: column;
        align-items: stretch;
    }
    .btn {
        justify-content: center;
    }
    .stats-badge {
        justify-content: center;
    }
    table {
        font-size: 12px;
    }
    th, td {
        padding: 8px 6px;
        font-size: 11px;
    }
    .totals td {
        font-size: 12px;
    }
    .toast {
        right: 15px;
        left: 15px;
        bottom: 15px;
        text-align: center;
        justify-content: center;
    }
}

@media(max-width:480px) {
    th, td {
        padding: 5px 4px;
        font-size: 10px;
    }
    .del-btn {
        padding: 3px 6px;
        font-size: 10px;
    }
    .header-title {
        font-size: 16px;
    }
    .header-subtitle {
        font-size: 11px;
    }
    .btn {
        font-size: 12px;
        padding: 8px 14px;
    }
    .stats-badge {
        font-size: 11px;
        padding: 4px 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- ===== HEADER ===== -->
    <div class="header-top">
        <div class="header-left">
            <img class="header-logo" src="https://i.ibb.co/67rtz5TD/Chat-GPT-Image-Jul-12-2026-02-36-50-PM.png" alt="Logo" onerror="this.style.display='none'">
            <div class="header-info">
                <span class="header-title">📊 <span>Account transfers</span></span>
                <span class="header-subtitle">Created By Hussein Gamal Sr.Operation &amp; 3PL Logistics</span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-theme" onclick="toggleTheme()" title="تغيير الوضع">🌙</button>
        </div>
    </div>

    <!-- ===== INPUT SECTION ===== -->
    <div class="input-section">
        <textarea id="pasteData" placeholder="📋 الصق من Excel أو Google Sheets هنا..." oninput="autoLoad()"></textarea>
    </div>

    <!-- ===== ACTIONS BAR ===== -->
    <div class="actions-bar">
        <button class="btn btn-copy" onclick="copyImage()">📋 نسخ الصورة</button>
        <button class="btn btn-export" onclick="exportExcel()">📤 تصدير Excel</button>
        <button class="btn btn-reset" onclick="resetAll()">🔄 مسح الكل</button>
        <span class="spacer"></span>
        <span class="stats-badge">📊 عدد الأوردرات: <span class="num" id="rowCount">0</span></span>
        <span class="stats-badge">💰 الإجمالي: <span class="num" id="totalDisplay">0</span></span>
    </div>

    <!-- ===== TABLE ===== -->
    <div id="capture">
        <table id="table">
            <thead>
                <tr>
                    <th>📅 تاريخ</th>
                    <th>📦 أوردر</th>
                    <th>💰 إجمالي</th>
                    <th>💳 تحصيل</th>
                    <th>👤 المندوب</th>
                    <th>💵 دفع</th>
                    <th>🏦 ديبوزت</th>
                    <th>🔄 تحويل</th>
                    <th>📅 تاريخ ديبوزت</th>
                    <th>🔄 تحويل</th>
                    <th>📅 تاريخ تحويل</th>
                    <th class="no-img">🗑️ حذف</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr class="totals">
                    <td colspan="2">📊 إجمالي المبلغ</td>
                    <td id="t1">0</td>
                    <td colspan="9"></td>
                </tr>
                <tr class="totals collected">
                    <td colspan="2">✅ التحصيل</td>
                    <td id="t2">0</td>
                    <td colspan="9"></td>
                </tr>
                <tr class="totals">
                    <td colspan="2">🏦 الديبوزت</td>
                    <td id="t3">0</td>
                    <td colspan="9"></td>
                </tr>
                <tr class="totals">
                    <td colspan="2">🔄 التحويل</td>
                    <td id="t4">0</td>
                    <td colspan="9"></td>
                </tr>
            </tfoot>
        </table>
    </div>

</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="toast">
    <span class="toast-icon">✅</span>
    <span id="toastMessage">تم النسخ</span>
</div>

<script>
let timer;

// ===== Helper functions =====
function cleanNumber(v) {
    return parseFloat((v || "0").toString().replace(/,/g, "")) || 0;
}

function formatNumber(num) {
    return num.toLocaleString();
}

// ===== Toast =====
let toastTimeout;

function showToast(message, icon = '✅') {
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    toastMessage.textContent = message;
    toast.querySelector('.toast-icon').textContent = icon;
    toast.classList.add('show');

    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

// ===== Theme toggle =====
function toggleTheme() {
    const html = document.documentElement;
    const btn = document.querySelector('.btn-theme');
    if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        btn.textContent = '🌙';
        localStorage.setItem('theme', 'light');
        showToast('☀️ تم التبديل إلى الوضع النهاري', '☀️');
    } else {
        html.setAttribute('data-theme', 'dark');
        btn.textContent = '☀️';
        localStorage.setItem('theme', 'dark');
        showToast('🌙 تم التبديل إلى الوضع الليلي', '🌙');
    }
}

window.addEventListener("load", function() {
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.querySelector('.btn-theme').textContent = '☀️';
    }
    loadData();
});

// ===== Create row =====
function createRow(cols) {
    const tr = document.createElement("tr");

    // ترتيب الأعمدة:
    // 0: تاريخ | 1: أوردر | 2: إجمالي | 3: تحصيل | 4: المندوب | 5: دفع
    // 6: ديبوزت | 7: تحويل | 8: تاريخ ديبوزت | 9: تحويل | 10: تاريخ تحويل
    const editableIndexes = [2, 3, 4, 6, 9];

    const totalCols = 11;

    for (let i = 0; i < totalCols; i++) {
        const td = document.createElement("td");
        td.innerText = cols[i] || "";

        if (editableIndexes.includes(i)) {
            td.classList.add("editable");
            td.contentEditable = true;
            td.oninput = function() {
                updateTotals();
                saveData();
            };
        }

        tr.appendChild(td);
    }

    const del = document.createElement("td");
    del.classList.add("no-img");
    del.innerHTML = `<button class="del-btn" onclick="deleteRow(this)">❌</button>`;
    tr.appendChild(del);

    return tr;
}

// ===== Delete row =====
function deleteRow(btn) {
    if (confirm('هل أنت متأكد من حذف هذا الصف؟')) {
        btn.closest("tr").remove();
        updateTotals();
        saveData();
        showToast('🗑️ تم حذف الصف', '🗑️');
    }
}

// ===== Save data =====
function saveData() {
    const rows = [];
    document.querySelectorAll("#table tbody tr").forEach(tr => {
        const cols = [];
        tr.querySelectorAll("td:not(.no-img)").forEach(td => {
            cols.push(td.innerText);
        });
        rows.push(cols.join("\t"));
    });
    const text = rows.join("\n");
    localStorage.setItem('reportData', text);
    document.getElementById('pasteData').value = text;
}

// ===== Load data from textarea =====
function loadData() {
    const text = document.getElementById('pasteData').value.trim();
    
    if (!text) {
        document.querySelector("#table tbody").innerHTML = "";
        localStorage.removeItem('reportData');
        updateTotals();
        updateStats();
        return;
    }

    const rows = text.split("\n");
    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";

    rows.forEach((row) => {
        const cols = row.split("\t");
        if (cols.length >= 3 && !isNaN(cleanNumber(cols[2]))) {
            tbody.appendChild(createRow(cols));
        }
    });

    updateTotals();
    updateStats();
    saveData();
}

// ===== Auto load =====
function autoLoad() {
    clearTimeout(timer);
    timer = setTimeout(() => {
        loadData();
        saveData();
    }, 300);
}

// ===== Update totals =====
function updateTotals() {
    let total = 0, collected = 0, deposit = 0, transfer = 0;

    document.querySelectorAll("#table tbody tr").forEach(r => {
        const td = r.children;
        total += cleanNumber(td[2]?.innerText);
        collected += cleanNumber(td[3]?.innerText);
        deposit += cleanNumber(td[6]?.innerText);
        transfer += cleanNumber(td[9]?.innerText);
    });

    document.getElementById('t1').innerText = formatNumber(total);
    document.getElementById('t2').innerText = formatNumber(collected);
    document.getElementById('t3').innerText = formatNumber(deposit);
    document.getElementById('t4').innerText = formatNumber(transfer);
    document.getElementById('totalDisplay').innerText = formatNumber(total);
    updateStats();
}

// ===== Update stats =====
function updateStats() {
    const count = document.querySelectorAll("#table tbody tr").length;
    document.getElementById('rowCount').innerText = count;
}

// ===== Copy image =====
async function copyImage() {
    const capture = document.querySelector("#capture");

    document.querySelectorAll(".no-img").forEach(el => {
        el.style.display = "none";
    });

    try {
        const canvas = await html2canvas(capture, {
            scale: 2.5,
            backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--neu-bg').trim() || '#e0e5ec',
            useCORS: true,
            logging: false,
            borderRadius: '20px'
        });

        try {
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            await navigator.clipboard.write([
                new ClipboardItem({ "image/png": blob })
            ]);
            showToast('✅ تم نسخ الصورة للحافظة', '📸');
        } catch (clipError) {
            const a = document.createElement("a");
            a.download = `report-${new Date().toISOString().slice(0,10)}.png`;
            a.href = canvas.toDataURL('image/png');
            a.click();
            showToast('📥 تم تحميل الصورة', '📥');
        }
    } catch (error) {
        console.error(error);
        showToast('❌ فشل نسخ الصورة', '❌');
    }

    document.querySelectorAll(".no-img").forEach(el => {
        el.style.display = "";
    });
}

// ===== Export Excel =====
function exportExcel() {
    const rows = [];
    const headers = [];
    document.querySelectorAll("#table thead th:not(.no-img)").forEach(th => {
        headers.push(th.innerText.replace(/[📅📦💰💳👤💵🏦🔄🗑️]/g, '').trim());
    });
    rows.push(headers.join('\t'));

    document.querySelectorAll("#table tbody tr").forEach(tr => {
        const cols = [];
        tr.querySelectorAll("td:not(.no-img)").forEach(td => {
            cols.push(td.innerText);
        });
        rows.push(cols.join('\t'));
    });

    const totals = [];
    document.querySelectorAll("#table tfoot tr").forEach(tr => {
        const cols = [];
        tr.querySelectorAll("td:not(.no-img)").forEach(td => {
            cols.push(td.innerText);
        });
        if (cols.length > 0) rows.push(cols.join('\t'));
    });

    const text = rows.join('\n');
    const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `report-${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
    showToast('📤 تم تصدير التقرير', '📤');
}

// ===== Reset all =====
function resetAll() {
    if (document.querySelectorAll("#table tbody tr").length === 0) {
        showToast('⚠️ لا توجد بيانات للمسح', '⚠️');
        return;
    }
    if (confirm('هل أنت متأكد من مسح جميع البيانات؟')) {
        document.querySelector("#table tbody").innerHTML = '';
        document.getElementById('pasteData').value = '';
        localStorage.removeItem('reportData');
        updateTotals();
        showToast('🗑️ تم مسح جميع البيانات', '🗑️');
    }
}

// ===== Keyboard shortcuts =====
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        copyImage();
    }
    if (e.ctrlKey && e.shiftKey && e.key === 'E') {
        e.preventDefault();
        exportExcel();
    }
    if (e.ctrlKey && e.shiftKey && e.key === 'C') {
        e.preventDefault();
        resetAll();
    }
});

console.log('  Ctrl+Enter     : نسخ الصورة');
console.log('  Ctrl+Shift+E   : تصدير Excel');
console.log('  Ctrl+Shift+C   : مسح الكل');
